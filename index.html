<!-- Alteração do HTML! -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processo Seletivo • Barbie Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte estilosa -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fundo Cintilante / Estrelas -->
    <div class="glitter-bg" id="glitterBg"></div>

    <!-- TELA 1: Animação Inicial da Barbie Baseada na Imagem Enviada -->
    <div id="introScreen" class="screen active">
        <div class="card intro-card">
            <div class="barbie-avatar-container">
                <!-- Ilustração SVG Fiel à Imagem Enviada -->
                <svg class="barbie-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradiente do fundo azul turquesa idêntico à imagem -->
                        <radialGradient id="turquoiseGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#48cae4" />
                            <stop offset="100%" stop-color="#0077b6" />
                        </radialGradient>
                    </defs>

                    <!-- Fundo circular azul turquesa -->
                    <circle cx="100" cy="100" r="90" fill="url(#turquoiseGlow)"/>

                    <!-- Cabelo Loiro (Lado Posterior) -->
                    <path d="M60 70 Q55 120 70 170 L130 170 Q145 120 140 70 Z" fill="#ebd28b"/>

                    <!-- Camisa Jeans Azul Clara -->
                    <path d="M55 160 L60 120 L80 115 L100 125 L120 115 L140 120 L145 160 Z" fill="#90e0ef"/>
                    <!-- Gola da camisa jeans -->
                    <polygon points="80,115 100,125 85,135" fill="#ade8f4" stroke="#48cae4" stroke-width="1"/>
                    <polygon points="120,115 100,125 115,135" fill="#ade8f4" stroke="#48cae4" stroke-width="1"/>
                    <!-- Bolsos e botões dourados -->
                    <rect x="68" y="135" width="16" height="18" rx="2" fill="#78d6f0" stroke="#48cae4"/>
                    <circle cx="76" cy="138" r="1.5" fill="#ffd700"/>
                    <rect x="116" y="135" width="16" height="18" rx="2" fill="#78d6f0" stroke="#48cae4"/>
                    <circle cx="124" cy="138" r="1.5" fill="#ffd700"/>
                    <!-- Botões centrais -->
                    <circle cx="100" cy="135" r="2" fill="#ffd700"/>
                    <circle cx="100" cy="150" r="2" fill="#ffd700"/>

                    <!-- Pescoço com Colar Prateado Barbie -->
                    <rect x="91" y="90" width="18" height="28" fill="#f8d3b0"/>
                    <path d="M88 110 Q100 118 112 110" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
                    <text x="100" y="116" font-family="'Brush Script MT', cursive, sans-serif" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">Barbie</text>

                    <!-- Cabeça e Rosto -->
                    <circle cx="100" cy="72" r="26" fill="#f8d3b0"/>

                    <!-- Olhos Azuis Vibrantes com Cílios -->
                    <!-- Olho Esquerdo -->
                    <ellipse cx="89" cy="68" rx="5" ry="6" fill="#ffffff"/>
                    <ellipse cx="89" cy="68" rx="3" ry="4" fill="#0077b6"/>
                    <circle cx="88" cy="66" r="1" fill="#ffffff"/>
                    <path d="M83 64 Q89 61 95 65" fill="none" stroke="#222" stroke-width="1.2"/>

                    <!-- Olho Direito -->
                    <ellipse cx="111" cy="68" rx="5" ry="6" fill="#ffffff"/>
                    <ellipse cx="111" cy="68" rx="3" ry="4" fill="#0077b6"/>
                    <circle cx="110" cy="66" r="1" fill="#ffffff"/>
                    <path d="M105 65 Q111 61 117 64" fill="none" stroke="#222" stroke-width="1.2"/>

                    <!-- Sobrancelhas e Sorriso -->
                    <path d="M84 60 Q89 57 94 61" fill="none" stroke="#9c6644" stroke-width="1.2"/>
                    <path d="M106 61 Q111 57 116 60" fill="none" stroke="#9c6644" stroke-width="1.2"/>
                    <path d="M92 82 Q100 90 108 82" fill="#e63946" stroke="#d62828" stroke-width="0.5"/>
                    <path d="M93 82 Q100 86 107 82" fill="#ffffff"/>

                    <!-- Cabelo Loiro Frontal + Penteado/Trança no topo -->
                    <path d="M74 65 Q70 40 100 38 Q130 40 126 65 Q135 85 132 120 Q125 120 124 80 Q100 48 76 80 Q75 120 68 120 Q65 85 74 65 Z" fill="#f3e2a9"/>
                    <!-- Trança/Detalhe do topo preso -->
                    <ellipse cx="112" cy="42" rx="7" ry="4" fill="#e2c976" transform="rotate(-15 112 42)"/>
                    <ellipse cx="115" cy="45" rx="5" ry="3" fill="#ebd28b" transform="rotate(-15 115 45)"/>

                    <!-- Braço Esquerdo (Acenando com animação) -->
                    <g class="waving-arm">
                        <path d="M135 120 L160 95 L168 102 L143 128 Z" fill="#90e0ef"/>
                        <circle cx="165" cy="93" r="6" fill="#f8d3b0"/>
                    </g>
                </svg>
            </div>
            
            <h1>Olá, Futura Liderança! ✨</h1>
            <p>Preparada para brilhar no nosso processo seletivo?</p>
            <button id="startBtn" class="neon-btn">Entrar na Vaga 💖</button>
        </div>
    </div>

    <!-- TELA 2: Formulário de Inscrição -->
    <div id="formScreen" class="screen">
        <div class="card form-card">
            <h2>✨ Formulário de Inscrição ✨</h2>
            <form id="vagaForm">
                <div class="input-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome incrível">
                </div>

                <div class="input-group">
                    <label for="idade">Sua Idade:</label>
                    <input type="number" id="idade" required min="0" placeholder="Ex: 22">
                </div>

                <div class="input-group">
                    <label for="altura">Sua Altura (metros):</label>
                    <input type="number" id="altura" step="0.01" required min="0" placeholder="Ex: 1.70">
                </div>

                <button type="submit" class="neon-btn">Verificar Elegibilidade 💫</button>
            </form>
        </div>
    </div>

    <!-- TELA 3 / MODAL DE RESULTADO -->
    <div id="resultModal" class="modal-overlay hidden">
        <div class="modal-card" id="modalCard">
            <div id="modalEmoji" class="modal-emoji">✨</div>
            <h2 id="modalTitle">Resultado</h2>
            <p id="modalMessage">Mensagem aqui</p>
            <button id="restartBtn" class="neon-btn">Tentar Novamente / Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
